name: Build Windows

on:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/PACOTE-*.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

# Uma atualização nova substitui a compilação anterior da mesma branch.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Verificar exportação de fontes
        run: python -m unittest discover -s scripts/tests
      - name: Build
        run: dotnet build src/F8Translate/F8Translate.csproj -c Release
      - name: Publicar versão compacta (requer Desktop Runtime 10)
        run: dotnet publish src/F8Translate/F8Translate.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o artifacts/compact
      - name: Exportar fontes completos sem colocar ZIP no Git
        shell: pwsh
        run: |
          python scripts/build_zip.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem zips/f8translate-source-*.zip | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath artifacts/sources
      - name: Incluir instruções em cada pacote
        shell: pwsh
        run: |
          Copy-Item docs/PACOTE-COMPACTO.txt artifacts/compact/LEIA-ME.txt
          $rows = @('## Pacotes Windows x64', '', '| Pacote | Executável |', '| --- | ---: |')
          foreach ($package in @('compact')) {
            $file = Get-Item "artifacts/$package/F8Translate.exe"
            $size = '{0:N2} MB' -f ($file.Length / 1MB)
            $rows += "| $package | $size |"
          }
          $rows += @('', 'Downloads expiram em 7 dias. Requer .NET Desktop Runtime 10 x64 instalado separadamente; o runtime não está incluído. Build não substitui teste manual em Windows.')
          $rows | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: F8Translate-compact-win-x64
          path: artifacts/compact/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: F8Translate-fontes
          path: artifacts/sources/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Manter apenas os pacotes atuais desta branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cleanup_artifacts.py
